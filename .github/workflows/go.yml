# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Configure SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.TETRATE_CI_SSH_PRIVATE_KEY }}
    - name: Disable Strict Host Key Checking for SSH
      run: mkdir -p ~/.ssh && echo -e "\tStrictHostKeyChecking no" >> ~/.ssh/config && ssh-keyscan github.com >> ~/.ssh/known_hosts
    - name: Pull over SSH instead of HTTPS
      run: echo -e '[url "git@github.com:"]\n\tinsteadOf = https://github.com/' | sudo tee /etc/gitconfig
    - name: Install licenser
      run: 'go install github.com/liamawhite/licenser@v0.7.0'
    - name: Build
      run: make
      env:
        GOPRIVATE: github.com/tetrateio/*
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Configure SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.TETRATE_CI_SSH_PRIVATE_KEY }}
    - name: Disable Strict Host Key Checking for SSH
      run: mkdir -p ~/.ssh && echo -e "\tStrictHostKeyChecking no" >> ~/.ssh/config && ssh-keyscan github.com >> ~/.ssh/known_hosts
    - name: Pull over SSH instead of HTTPS
      run: echo -e '[url "git@github.com:"]\n\tinsteadOf = https://github.com/' | sudo tee /etc/gitconfig
    - name: Install licenser
      run: 'go install github.com/liamawhite/licenser@v0.7.0'
    - name: Build
      run: make check
      env:
        GOPRIVATE: github.com/tetrateio/*
  sdk-typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Configure SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.TETRATE_CI_SSH_PRIVATE_KEY }}
    - name: Disable Strict Host Key Checking for SSH
      run: mkdir -p ~/.ssh && echo -e "\tStrictHostKeyChecking no" >> ~/.ssh/config && ssh-keyscan github.com >> ~/.ssh/known_hosts
    - name: Pull over SSH instead of HTTPS
      run: echo -e '[url "git@github.com:"]\n\tinsteadOf = https://github.com/' | sudo tee /etc/gitconfig
    - name: Typecheck the generated SDK
      run: make sdk.typecheck
      env:
        GOPRIVATE: github.com/tetrateio/*
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - run: npm ci
    - name: Verify the tarball is installable
      run: ./hack/smoke-package.sh
